# GitHub で毎回テストを回す（CI）。2026-10-06 導入。
#
# 目的: 変更を main（本番）に入れる前に、予約システム全体のテストを毎回同じ条件で回す。
#   - PR を作ったとき・更新したとき、main に入ったときに動く
#   - Render の自動デプロイを「After CI Checks Pass」にすると、ここが✅になるまで本番に出ない
#
# アクションは公開から7日以上たった版を、差し替えられないようコミットの SHA で固定している。
# 上げるときも同じ考え方で（タグ名だけで指定しない）。
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: probe
          POSTGRES_DB: probe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11" # 本番（render.yaml）は 3.11.9
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # Render のビルドと同じ入れ方。requirements.txt は版を固定していないので、
      # 新しい版が出て壊れたらここで先に分かる
      - run: pip install -r requirements.txt
      # マイグレーションが空のDBで最後まで通るか（テスト用とは別のDBで）
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:probe@localhost:5432/postgres?ssl=disable
      # 実DBのテストは、テストごとに作る schema の中で表を作り、終わったら消す
      - run: python -m pytest -q tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:probe@localhost:5432/probe?ssl=disable

  frontend:
    name: frontend (type check + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20" # 本番（render.yaml）と同じ
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # package-lock.json のとおりに入れる（新しい版は取りに行かない）
      - run: npm ci
      # tsc（型チェック）＋ vite build。本番のビルドと同じ
      - run: npm run build
